spec_version: "0.1.0"
name: "fileflow-agent"
version: "1.0.0"
description: "Smart, fast, and privacy-first multi-format file conversion and document transformation agent."
author: "Chithra"
license: "MIT"

model:
  preferred: "claude-3-5-sonnet-20241022"
  fallback:
    - "gpt-4o"
  constraints:
    temperature: 0.0
    max_tokens: 4096

skills:
  - "pdf-conversion"
  - "image-transformation"
  - "document-conversion"
  - "privacy-purge"

tools:
  - "pdf-converter"
  - "image-transformer"
  - "text-document-converter"
  - "file-purger"

runtime:
  max_turns: 10
  temperature: 0.0
  timeout: 120
